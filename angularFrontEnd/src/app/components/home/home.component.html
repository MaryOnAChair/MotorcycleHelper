<h1 class="title" xmlns:th="http://www.w3.org/1999/xhtml">My Virtual Garage</h1>


<form th:action="@{/Motorcycles/save}" th:object="${Motorcyle}" method="post">


  <button (click)="addMotorcycle()">Add</button>

</form>

<div *ngFor="let bike of motorcyles">
  <h3>{{bike.brand}}</h3>
  <h3>{{bike.model}}</h3>
  <h3>{{bike.year}}</h3>
</div>
