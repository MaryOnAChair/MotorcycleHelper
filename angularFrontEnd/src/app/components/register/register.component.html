<p>register works!</p>
<div>

  <h2>Register</h2>

  <input
    type="text"
    name="username"
    [(ngModel)]="user.username"
    placeholder="Username"
  />
  <input
    type="text"
    name="email"
    [(ngModel)]="user.email"
    placeholder="Email"
  />

  <input
    type="text"
    name="password"
    [(ngModel)]="user.password"
    placeholder="Password"
  />

  <button (click)="register()">
    Create Account
  </button>

</div>
