version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: motorcycledb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-backend:
    image: maryonachair/motorcyclegaragehelper-spring-backend:latest
    container_name: spring-backend
    ports:
      - "8080:8080"
    environment:
     SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/motorcycledb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
     SPRING_DATASOURCE_USERNAME: root
     SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  angular-frontend:
    image: maryonachair/motorcyclegaragehelper-angular-frontend:latest
    container_name: angular-frontend
    ports:
      - "4200:80"
    depends_on:
      - spring-backend
    restart: unless-stopped